# Package whose UID is allowed to access the protected local service ports.
PKG=com.omarea.vtools

# Space-separated TCP ports to hide from loopback connect probes.
PORTS="8788 8765 14731 14754"

# Enable socket hooks for connect() interception.
ENABLE_HOOKS=1

# Extra UIDs that may access the protected ports, separated by spaces.
# Normally this can stay empty; use it if your target build has helper processes.
EXTRA_ALLOWED_UIDS=""

# Wait until package manager or a running process reveals the real package UID.
WAIT_FOR_UID_TIMEOUT=300

# Set to 1 if you want to wait for the app process before loading hooks.
WAIT_FOR_PROCESS=0
